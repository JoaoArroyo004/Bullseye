<!DOCTYPE html>
<html>
<head>
    <title>Upload Target Images</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        form { margin-top: 20px; }
        input, select, button { margin: 5px; }
    </style>
</head>
<body>
    <h1>Upload Target Images</h1>

    <p>Current mode: <b>{{ mode }}</b></p>
    <a href="{{ url_for('index') }}">← Back to main page</a>

    <form method="POST" enctype="multipart/form-data">
        <label for="target_name">Select target:</label>
        <select name="target_name" id="target_name" required>
            <option value="">-- Select target --</option>
            {% for target in targets %}
                <option value="{{ target }}">{{ target }}</option>
            {% endfor %}
        </select><br>

        <label for="files">Select images:</label>
        <input type="file" name="files" id="files" accept="image/*" multiple required><br>

        <!-- Usa o componente ModeButton -->
        <mode-button 
            label="Upload"
            mode="upload"
            current_mode="{{ mode }}">
        </mode-button>
    </form>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul style="color: green;">
            {% for msg in messages %}
                <li>{{ msg }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <!-- Importa o componente -->
    <script type="module">
        class ModeButton extends HTMLElement {
            connectedCallback() {
                const label = this.getAttribute("label") || "";
                const mode = this.getAttribute("mode") || "";
                const current = this.getAttribute("current_mode") || "";

                const isActive = mode === current;

                this.innerHTML = `
                    <button
                        type="submit"
                        style="
                            padding: 10px 18px;
                            font-size: 16px;
                            border-radius: 6px;
                            border: none;
                            cursor: pointer;
                            background-color: ${isActive ? '#4CAF50' : '#ddd'};
                            color: ${isActive ? 'white' : 'black'};
                        "
                    >
                        ${label}
                    </button>
                `;
            }
        }

        customElements.define("mode-button", ModeButton);
    </script>

</body>
</html>
